name: Build Windows Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'requirements.txt'
      - '.github/workflows/build-release.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.15.0

      - name: Smoke test PaddleOCR runtime
        shell: pwsh
        run: |
          python -c "import paddle, paddlex, paddleocr; print('paddle', paddle.__version__); print('paddlex', paddlex.__version__); print('paddleocr', paddleocr.__version__); from paddleocr import PaddleOCR; PaddleOCR(lang='korean', use_doc_orientation_classify=False, use_doc_unwarping=False, use_textline_orientation=False); print('PaddleOCR init OK')"

      - name: Build portable app
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name DefectFormExtractor `
            --collect-all paddleocr `
            --collect-all paddlex `
            --collect-all paddle `
            --collect-all PySide6 `
            app.py

      - name: Smoke test packaged windowed EXE
        shell: pwsh
        run: |
          Remove-Item runtime-smoke-ok.txt -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath "dist/DefectFormExtractor/DefectFormExtractor.exe" -ArgumentList "--import-test" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Packaged EXE import test failed with exit code $($p.ExitCode)" }
          if (-not (Test-Path runtime-smoke-ok.txt)) { throw "Packaged EXE did not create runtime-smoke-ok.txt" }
          Get-Content runtime-smoke-ok.txt

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path dist/DefectFormExtractor/* -DestinationPath DefectFormExtractor-v0.1.2-windows-x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DefectFormExtractor-v0.1.2-windows-x64
          path: DefectFormExtractor-v0.1.2-windows-x64.zip

      - name: Create or update v0.1.2 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.1.2"
          git fetch --tags
          if (-not (git tag -l $tag)) {
            git tag $tag $env:GITHUB_SHA
            git push origin $tag
          }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "v0.1.2 - Windows GUI 런타임 수정" --notes "PyInstaller windowed 모드에서 sys.stderr가 None이 되어 PaddleX 폰트/모델 다운로드가 중단되던 문제를 수정했습니다. 빌드된 EXE 자체의 PaddleOCR import smoke test를 추가했습니다. API 키와 유료 서비스는 필요 없습니다."
          }
          gh release upload $tag DefectFormExtractor-v0.1.2-windows-x64.zip --clobber
